<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego de Dados</title>
</head>
<body>

    <h1>Juego de dados</h1>

    <div id="caja-jugador">
        <h2>Tú</h2>
        <span class="dado" id="dado-j1">-</span>
        <span class="dado" id="dado-j2">-</span>
        <span class="dado" id="dado-j3">-</span>
        <span id="combo-jugador">Sin tirar</span>
    </div>

    <div id="caja-ordenador">
        <h2>Ordenador</h2>
        <span class="dado" id="dado-o1">-</span>
        <span class="dado" id="dado-o2">-</span>
        <span class="dado" id="dado-o3">-</span>
        <span id="combo-ordenador">Sin tirar</span>
    </div>

    <h3 id="resultado">Esperando tirada...</h3>

    <button id="btn-lanzar">Lanzar dados</button>
    <button id="btn-reiniciar">Reiniciar</button>

    
    <script src="actividad2.38.js" defer></script>
</body>
</html>
